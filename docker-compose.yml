services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/bugboard
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongo
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
  uploads:
